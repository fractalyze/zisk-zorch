# Commit-scope policy for zisk-zorch.
#
# A scope is the directory the change lives in, named with the `zisk_zorch/`
# root stripped — commit, constraints, deep, evals, fri, logup, poseidon2,
# quotient, transcript. It must be the deepest directory containing every
# touched file.
#
# The modules directly under the package are the top-level prover and its
# fixtures; they sit above any directory, so the [scopes] entries below name
# them. A change spanning several packages takes no scope, which is why a scope
# is not required.

roots = ["zisk_zorch"]
require_scope = false

exempt_paths = [
  "docs",
  "README.md",
  "CLAUDE.md",
  "LICENSE",
  ".github",
  ".gitignore",
  ".bazelrc",
  ".python-version",
  ".pre-commit-config.yaml",
  ".fractal-commit-lint.toml",
  "scripts",
  "tools",
  "pyproject.toml",
  "requirements.in",
  "requirements_lock_3_11.txt",
  "MODULE.bazel",
  "MODULE.bazel.lock",
  "BUILD.bazel",
  "zisk_zorch/BUILD.bazel",
  # Vendored fixtures travel with the code that reads them, so refreshing them
  # alongside keeps the code's scope. Exempted rather than folded away by the
  # dictionary: these trees have their own subdirectories (golden/,
  # fullprogram/), and the dictionary drops one named segment while leaving
  # what is beneath it, so fri/testdata/golden would derive to `fri/golden`.
  "zisk_zorch/commit/testdata",
  "zisk_zorch/evals/testdata",
  "zisk_zorch/fri/testdata",
  "zisk_zorch/logup/testdata",
  "zisk_zorch/poseidon1/testdata",
  "zisk_zorch/poseidon2/testdata",
  "zisk_zorch/quotient/testdata",
  "zisk_zorch/transcript/testdata",
]

[scopes]
prover = ["zisk_zorch/prover.py", "zisk_zorch/prover_test.py"]
golden = ["zisk_zorch/golden.py"]
bench = ["zisk_zorch/bench_inner_proof.py", "zisk_zorch/bench_inner_proof_test.py"]
release = ["zisk_zorch/__init__.py"]
