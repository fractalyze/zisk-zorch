[package]
name = "zisk-zorch-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "pil2-proofman's gen_proof over zisk-zorch's exported StableHLO artifacts: the host half of genProof in Rust, the device half compiled from the manifest."

[dependencies]
# PJRT over the frx/jax CUDA plugin. Pinned to the fractalyze fork commit
# that adds per-session client options (preallocate=false is what lets one
# client per pil2 stream share the card; eager_load_executable_modules is
# what moves a loaded executable's module loads off the prove path;
# staging_threshold_bytes is what keeps the uploads above 1 GiB on the pinned
# path; allocator is which device allocator each client builds). The pin
# tracks that crate's `feat/session-options` line, which is where those
# options live -- it has never been on its `main`.
xla-pjrt = { git = "https://github.com/fractalyze/xla-pjrt", rev = "c07933c" }
# pil2's own Fiat-Shamir transcript (Poseidon1/2 over Goldilocks). The
# proofman fork that consumes this crate patches every pil2-proofman crate
# to one checkout, so `fields` resolves to the same crate proofman uses.
fields = { git = "https://github.com/0xPolygonHermez/pil2-proofman.git", tag = "v1.0.0-alpha" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Outside proofman's tree `fields` has no C backend to lean on; its pure-Rust
# field arithmetic (the verifier's build) serves the standalone tool. Inside
# a proofman build leave this off so `fields` stays the crate proofman uses.
standalone = ["fields/verify"]
# One NVTX range per program around its execution, so `nsys` can attribute
# kernels program by program (`src/nvtx.rs`, docs/bridge.md "Profiling").
# Links the CUDA toolkit's NVTX interop library; leave it off in proofman
# builds, which have no reason to carry it.
nvtx = []

[[bin]]
name = "zz_prove"
path = "src/bin/zz_prove.rs"
